# Included at nginx http scope. Only browser page GET/HEAD requests redirect.
map $http_user_agent $period_observer_phone {
    default 0;
    ~*(iPhone|iPod|Android.*Mobile|Windows.Phone|IEMobile|Opera.Mini) 1;
}
map "$request_method:$period_observer_phone:$uri" $period_observer_mobile_target {
    default "";
    "GET:1:/" /m;
    "HEAD:1:/" /m;
    ~^(?:GET|HEAD):1:(/materials/[^/]+/?)$ /m$1;
    ~^(?:GET|HEAD):1:(/self-materials/[^/]+/?)$ /m$1;
}
