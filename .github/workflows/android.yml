name: Android build and checks
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', '.github/workflows/android.yml']
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.3.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6.4.1
        with:
          gradle-version: '8.13'
      - name: Prepare Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Tests, lint and unsigned release
        run: gradle -p android --no-daemon --max-workers=2 testDebugUnitTest lintRelease assembleRelease
      - name: Preserve checks and unsigned package
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: android-unsigned-build-and-reports
          retention-days: 14
          path: |
            android/app/build/outputs/apk/release/*unsigned.apk
            android/app/build/reports/
            android/app/build/test-results/
